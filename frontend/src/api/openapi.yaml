openapi: 3.1.0
info:
  title: Precursor Intelligence API (proposed read endpoints)
  version: 0.1.0
  description: >
    The contract the React app codes against, proposed in docs/adr/0001-ui-hosting-and-auth.md. Paths are under
    /api/v1 so they never collide with the app's own routes on the same origin. Every endpoint needs a Google ID
    token (Authorization: Bearer) except /api/v1/health. Agent endpoints (K3-K5) join once their output models exist.
    When the FastAPI app exists, `npm run gen:api` points at its /openapi.json instead of this file.
paths:
  /api/v1/status:
    get:
      summary: The month being served and its model (K6)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Status"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/overview:
    get:
      summary: This month at a glance, counted from the evidence files (proposed, G2)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Overview"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/facilities:
    get:
      summary: Search and page this month's scored facilities (proposed, G1 and G2)
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 80}, description: name, city or CCN}
        - {name: state, in: query, schema: {type: string, pattern: "^[A-Z]{2}$"}}
        - {name: decile, in: query, schema: {type: integer, minimum: 1, maximum: 10}}
        - {name: sort, in: query, schema: {type: string, enum: [p_desc, p_asc, name_asc], default: p_desc}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/FacilityPage"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/facilities/{ccn}:
    get:
      summary: One facility's score, reasons, citations, penalties and chain (K6, G3)
      parameters:
        - {name: ccn, in: path, required: true, schema: {type: string, pattern: "^[0-9A-Z]{6}$"}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/FacilityProfile"}}}}
        default: {$ref: "#/components/responses/Error"}
  /api/v1/ops:
    get:
      summary: The ops evidence of the scoring model, no LLM (proposed, G5)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Ops"}}}}
        default: {$ref: "#/components/responses/Error"}
components:
  responses:
    Error:
      description: Any error. 400 bad input, 401 no or bad token, 403 not on the allowlist, 404 unknown CCN, 429 the daily cap.
      content: {application/json: {schema: {$ref: "#/components/schemas/ErrorBody"}}}
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string, description: safe to show to the user}
            request_id: {type: string}
            retry_after_s: {type: [integer, "null"], description: set on 429}
    DataAsOf:
      type: object
      required: [v, score_month, model_version, gold_run_id]
      properties:
        v: {type: string, pattern: "^20[0-9]{2}-[0-9]{2}$"}
        score_month: {type: string, format: date}
        model_version: {type: integer}
        gold_run_id: {type: string}
    Status:
      allOf:
        - $ref: "#/components/schemas/DataAsOf"
        - type: object
          required: [model_name, candidate, scored_at, gold_verified, stale_refresh, n_facilities, flags, base_rate]
          properties:
            model_name: {type: string}
            candidate: {type: string}
            scored_at: {type: string, format: date-time}
            gold_verified: {type: boolean}
            stale_refresh: {type: boolean}
            n_facilities: {type: integer}
            flags: {type: array, items: {type: string}}
            decision: {type: [string, "null"]}
            base_rate: {type: number, description: the champion's test-month base rate}
    FacilityRow:
      type: object
      required: [ccn, name, city, state, chain_id, chain_name, beds, p, risk_percentile, risk_decile]
      properties:
        ccn: {type: string}
        name: {type: [string, "null"]}
        city: {type: [string, "null"]}
        state: {type: [string, "null"]}
        chain_id: {type: [string, "null"]}
        chain_name: {type: [string, "null"]}
        beds: {type: [number, "null"]}
        p: {type: number}
        risk_percentile: {type: number}
        risk_decile: {type: integer, minimum: 1, maximum: 10, description: 1 is the riskiest tenth of the month}
    FacilityPage:
      type: object
      required: [items, total, offset, limit, data_as_of]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/FacilityRow"}}
        total: {type: integer}
        offset: {type: integer}
        limit: {type: integer}
        data_as_of: {$ref: "#/components/schemas/DataAsOf"}
    Chain:
      type: object
      required: [chain_id, n_facilities, beds, expected_facilities_with_event, p_any_event, max_p, worst_ccn, share_top_decile]
      properties:
        evidence_id: {type: string}
        chain_id: {type: string}
        chain_name: {type: [string, "null"]}
        n_facilities: {type: integer}
        beds: {type: number}
        expected_facilities_with_event: {type: number}
        p_any_event: {type: number}
        bed_weighted_mean_p: {type: [number, "null"]}
        max_p: {type: number}
        worst_ccn: {type: string}
        share_top_decile: {type: number}
    Overview:
      type: object
      required: [data_as_of, deciles, states, riskiest, chains]
      properties:
        data_as_of: {$ref: "#/components/schemas/DataAsOf"}
        deciles:
          type: array
          items: {type: object, required: [risk_decile, n, mean_p], properties: {risk_decile: {type: integer}, n: {type: integer}, mean_p: {type: number}}}
        states:
          type: array
          items: {type: object, required: [state, n, n_top_decile, mean_p], properties: {state: {type: [string, "null"]}, n: {type: integer}, n_top_decile: {type: integer}, mean_p: {type: number}}}
        riskiest: {type: array, items: {$ref: "#/components/schemas/FacilityRow"}}
        chains: {type: array, items: {$ref: "#/components/schemas/Chain"}}
    Reason:
      type: object
      required: [evidence_id, direction, rank, feature, label, feature_value, contribution_logodds]
      properties:
        evidence_id: {type: string}
        direction: {type: string, enum: [raises, lowers]}
        rank: {type: integer}
        feature: {type: string}
        label: {type: string}
        feature_value: {type: [string, "null"]}
        contribution_logodds: {type: number}
    Citation:
      type: object
      required: [evidence_id, survey_date, ftag, deficiency_category, scope_severity, is_standard, is_complaint, correction_date]
      properties:
        evidence_id: {type: string}
        survey_date: {type: string, format: date}
        ftag: {type: string}
        deficiency_category: {type: string}
        scope_severity: {type: string, pattern: "^[A-L]$"}
        is_standard: {type: boolean}
        is_complaint: {type: boolean}
        correction_date: {type: [string, "null"], format: date}
    Penalty:
      type: object
      required: [evidence_id, penalty_date, penalty_type, fine_amount, payment_denial_start_date, payment_denial_length_days]
      properties:
        evidence_id: {type: string}
        penalty_date: {type: string, format: date}
        penalty_type: {type: string}
        fine_amount: {type: [number, "null"]}
        payment_denial_start_date: {type: [string, "null"], format: date}
        payment_denial_length_days: {type: [number, "null"]}
    FacilityProfile:
      type: object
      required: [data_as_of, facility, score, reasons, citations, penalties, chain]
      properties:
        data_as_of: {$ref: "#/components/schemas/DataAsOf"}
        facility:
          allOf:
            - $ref: "#/components/schemas/FacilityRow"
            - type: object
              properties: {address: {type: [string, "null"]}, zip: {type: [string, "null"]}}
        score:
          type: object
          required: [evidence_id, p, risk_percentile, risk_decile]
          properties: {evidence_id: {type: string}, p: {type: number}, risk_percentile: {type: number}, risk_decile: {type: integer}}
        reasons: {type: array, items: {$ref: "#/components/schemas/Reason"}}
        citations: {type: array, items: {$ref: "#/components/schemas/Citation"}, description: last 36 months, newest first}
        penalties: {type: array, items: {$ref: "#/components/schemas/Penalty"}, description: last 36 months, newest first}
        chain: {oneOf: [{$ref: "#/components/schemas/Chain"}, {type: "null"}]}
    Interval:
      type: object
      required: [estimate, ci_low, ci_high]
      properties: {estimate: {type: number}, ci_low: {type: number}, ci_high: {type: number}}
    Ops:
      type: object
      required: [status, evaluation, gates]
      properties:
        status: {type: object, additionalProperties: true, description: monitor's status/latest.json as written}
        evaluation:
          type: object
          required: [ml_run_id, selected, test_months, rows, positives, ranking, probability, intervals, baselines, reliability, sanity, flags]
          properties:
            ml_run_id: {type: string}
            selected: {type: string}
            test_months: {type: array, items: {type: string}}
            rows: {type: integer}
            positives: {type: integer}
            ranking: {type: object, additionalProperties: {type: number}}
            probability: {type: object, additionalProperties: {type: number}}
            intervals: {type: object, additionalProperties: {$ref: "#/components/schemas/Interval"}}
            baselines: {type: object, additionalProperties: {type: number}, description: baseline PR-AUC by name}
            reliability:
              type: array
              items: {type: object, required: [bin, rows, mean_predicted, observed_rate], properties: {bin: {type: number}, rows: {type: number}, mean_predicted: {type: number}, observed_rate: {type: number}}}
            sanity: {type: object, additionalProperties: true}
            flags: {type: array, items: {type: string}}
        gates:
          description: the gate results of the run that registered the model; null until build-evidence writes ops_gates
          oneOf:
            - type: "null"
            - type: object
              required: [gate_outcome, gate_results]
              properties: {gate_outcome: {type: [string, "null"]}, gate_results: {type: [object, "null"], additionalProperties: true}}
