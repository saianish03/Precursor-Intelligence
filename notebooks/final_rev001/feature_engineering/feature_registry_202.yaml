# Every gold feature (docs/DATA_PIPELINE_SPEC.md §8): name, family, source_table, formula, first_available_vintage,
# dtype, model_use (model / ablation_only / product_only). Generated from the column contract
# (configs/contracts/facility_month_dataset_spec_columns.csv), whose dtype and model_use it keeps; the source
# tables are silver at vintage t (Δ features also t−6 / t−12). first_available_vintage was measured on the full
# archive (2021-01 -> 2026-08). tests/gold/test_feature_registry.py checks it against the built features.
#
# Star ratings (open item 6): follow the contract. staffing_rating and qm_rating are model,
# health_inspection_rating and overall_rating ablation_only. The quality family's measures come from
# configs/qm_measures.yaml (Checkpoint 4).
_meta:
  version: 1
features:
