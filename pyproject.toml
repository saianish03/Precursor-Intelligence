[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "precursor-intelligence"
version = "0.1.0"
description = "Precursor Intelligence: end-to-end MLOps platform for nursing-home regulatory risk (CMS data)"
readme = "README.md"
requires-python = ">=3.11"
# Core: what every stage imports (config, storage ports, logging, the ingestion CLI).
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "typer>=0.12",
  "requests>=2.31",
  "certifi",
  "tenacity>=8.2",
  "sqlalchemy>=2.0",
  "fsspec>=2024.2",
  "polars>=1.0",
]

[project.optional-dependencies]
# Cloud backends (prod): GCS files, BigQuery metadata + final dataset
gcp = ["gcsfs>=2024.2", "google-cloud-storage>=2.14", "google-cloud-bigquery>=3.17", "db-dtypes>=1.2"]
# Local development database (metadata store + local final table)
postgres = ["psycopg[binary]>=3.1"]
# Data-quality checks (silver/gold)
validation = ["pandera>=0.20"]
# Modelling stack
training = [
  "scikit-learn>=1.4", "lightgbm>=4.3", "catboost>=1.2", "interpret>=0.6",
  "shap>=0.45", "optuna>=3.6", "mlflow>=2.12",
]
# Drift and model monitoring
monitoring = ["evidently>=0.4"]
# Backend API + agents
backend = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic-ai>=0.4", "rank-bm25>=0.2"]
# Dashboard
frontend = ["streamlit>=1.35"]
# Tooling used by CI and pre-commit
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
  "types-requests",
]

[project.scripts]
precursor-ingest = "precursorintelligence.ingestion.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/precursorintelligence"]

# ---------------------------------------------------------------- tooling

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: hits the live CMS API (deselected by default; run with -m network)"]
addopts = "-ra -m 'not network'"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks", "data", "logs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
