# Airflow 3 (LocalExecutor) + Postgres for the CMS data pipeline: the same stack on a laptop and on the GCP VM.
# Every DAG task runs in its own precursor-pipeline container, started through docker-proxy (spec §15).
# A laptop sets its values in .env (copy .env.example): docs/runbooks/airflow-local.md. The VM's production values are
# in docker-compose.vm.yaml. The DAGs are baked into precursor-airflow. On a laptop, docker-compose.override.yaml
# (loaded automatically by `docker compose` in this folder) mounts the working tree over them; the VM runs this file
# with docker-compose.vm.yaml instead.
#
#   cd docker/airflow-local && cp .env.example .env    # then edit .env
#   docker compose up -d --wait                        # http://localhost:8080
name: pi-airflow

# The task network's subnet, fixed so that Postgres can refuse task containers everything but precursor_meta and
# mlflow (init-db.sh). 172.16.0.0/16 is outside Docker's default address pools and the GCP VPC. Changing it also needs
# the top lines of pg_hba.conf changed in every existing database, the VM's data disk included (init-db.sh never
# reruns); otherwise Postgres silently accepts the airflow login from task containers again.
x-tasks-subnet: &tasks-subnet 172.16.77.0/24

x-logging: &logging # container logs are capped (the VM disk is small)
  driver: local
  options: { max-size: 10m, max-file: "3" }

x-airflow-common: &airflow-common
  image: ${PI_AIRFLOW_IMAGE:-precursor-airflow:latest}
  user: "${AIRFLOW_UID:-50000}:0"
  logging: *logging
  networks: [default]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set it in .env}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/simple_auth_manager_passwords.json
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set it in .env}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET:?set it in .env}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set it in .env}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Kept small (designed for 2 vCPU / 8 GB; the VM is an e2-standard-4): the pipeline tasks are the heavy part.
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__CORE__PARALLELISM: "4"
    # Pipeline task containers (read by dags/utils/pipeline_operator.py at parse and run time)
    PI_DOCKER_URL: tcp://docker-proxy:2375
    PI_DOCKER_NETWORK: pi-airflow-tasks
    PI_DATABASE_URL: postgresql+psycopg://pi_meta:${PI_META_DB_PASSWORD:?set it in .env}@postgres:5432/precursor_meta
    PI_PIPELINE_IMAGE: ${PI_PIPELINE_IMAGE:-precursor-pipeline:latest}
    PI_PIPELINE_ENV: ${PI_PIPELINE_ENV:-prod}
    PI_HOST_DATA_DIR: ${PI_HOST_DATA_DIR:-}
    PI_BUCKET_URI: ${PI_BUCKET_URI:-}
    # Laptop against GCS: the host path of your gcloud ADC file, mounted read-only into task containers.
    # Leave empty on the VM (the metadata server's identity) and for local-disk runs.
    PI_GCP_CREDENTIALS_FILE: ${PI_GCP_CREDENTIALS_FILE:-}
    PI_GCP_PROJECT: ${PI_GCP_PROJECT:-precursor-intel-mlops}
    PI_TASK_MEM_LIMIT: ${PI_TASK_MEM_LIMIT:-}
    PI_AUTO_REMOVE: ${PI_AUTO_REMOVE:-success}
    PI_GOLD_TIMEOUT_MINUTES: ${PI_GOLD_TIMEOUT_MINUTES:-}
    PI_MLFLOW_TRACKING_URI: ${PI_MLFLOW_TRACKING_URI:-http://mlflow:5000} # passed to tasks as MLFLOW_TRACKING_URI
    # Alerts (src/precursorintelligence/alerts.py): read by the callbacks in these containers, never passed to task containers
    PI_ALERT_EMAIL_TO: ${PI_ALERT_EMAIL_TO:-}
    PI_ALERT_EMAIL_FROM: ${PI_ALERT_EMAIL_FROM:-}
    PI_ALERT_SMTP_HOST: ${PI_ALERT_SMTP_HOST:-}
    PI_ALERT_SMTP_PORT: ${PI_ALERT_SMTP_PORT:-}
    PI_ALERT_SMTP_USER: ${PI_ALERT_SMTP_USER:-}
    PI_ALERT_SMTP_PASSWORD: ${PI_ALERT_SMTP_PASSWORD:-}
  volumes:
    - airflow-config:/opt/airflow/config
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.10
    logging: *logging
    networks: [default, tasks]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set it in .env}
      POSTGRES_DB: airflow
      PI_META_DB_PASSWORD: ${PI_META_DB_PASSWORD:?set it in .env}
      PI_TASKS_SUBNET: *tasks-subnet
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-precursor-meta.sh:ro
    ports:
      - "127.0.0.1:${PI_POSTGRES_HOST_PORT:-55433}:5432" # for inspection from the host only: keep it on 127.0.0.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # The only way Airflow reaches the Docker API. It is on its own internal network that only the scheduler
  # (which runs the tasks: LocalExecutor) joins, so pipeline task containers, which open untrusted CMS zips,
  # cannot reach it. It filters API sections, not request bodies: whoever can change DAGs can still start any
  # container, so DAGs stay read-only, reviewed code.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.1
    logging: *logging
    networks: [docker-api]
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # One-shot: give the named volumes to the airflow user (they are created root-owned), migrate the DB, then create
  # the pool `heavy` (ML spec §15.6): gold and ML training take its one slot, so they never run together. A task in a
  # missing pool never runs.
  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/config /opt/airflow/logs
        && /entrypoint airflow db migrate
        && /entrypoint airflow pools set heavy 1 "memory-heavy tasks, one at a time (gold, ML training)"
    restart: "no"

  # One-shot, at every start: the role and database `mlflow` (ML spec §16.1). Idempotent, and it sets the password from
  # MLFLOW_DB_PASSWORD each time, so a rotation needs no hand step. On the default network, as the airflow superuser.
  postgres-setup:
    image: postgres:16.10
    logging: *logging
    networks: [default]
    environment:
      PGHOST: postgres
      PGUSER: airflow
      PGDATABASE: airflow
      PGPASSWORD: ${AIRFLOW_DB_PASSWORD:?set it in .env}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?set it in .env}
    entrypoint: ["sh", "-c"]
    command:
      - |
        # On a new volume the healthcheck can pass on the init-time server, which listens on the socket only.
        until pg_isready -q; do sleep 1; done
        psql -v ON_ERROR_STOP=1 -q <<'SQL'
        \getenv pw MLFLOW_DB_PASSWORD
        SELECT 'CREATE ROLE mlflow LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'mlflow') \gexec
        ALTER ROLE mlflow PASSWORD :'pw';
        SELECT 'CREATE DATABASE mlflow OWNER mlflow' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'mlflow') \gexec
        REVOKE CONNECT ON DATABASE mlflow FROM PUBLIC;
        SQL
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # The tracking server and model registry (ML spec §16.1). On the tasks network only: it has no login, so it must
  # not bridge into the network where Airflow and the airflow role live. Postgres accepts it from the task subnet for
  # database mlflow only (init-db.sh). Artifacts go through the server (--serve-artifacts) to PI_MLFLOW_ARTIFACTS: a
  # bucket prefix (laptops read the ADC file, like the task containers) or, by default, the named volume.
  mlflow:
    image: ${PI_MLFLOW_IMAGE:-precursor-mlflow:latest}
    logging: *logging
    networks: [tasks]
    environment:
      # +psycopg2: SQLAlchemy 2.1's default Postgres driver is psycopg 3, which the image doesn't have
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD:?set it in .env}@postgres:5432/mlflow
      PI_MLFLOW_ARTIFACTS: ${PI_MLFLOW_ARTIFACTS:-/mlflow/artifacts}
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/gcp/adc.json
      GOOGLE_CLOUD_PROJECT: ${PI_GCP_PROJECT:-precursor-intel-mlops}
    # The backend URI holds the password, so the server reads it from the environment (MLFLOW_BACKEND_STORE_URI); only
    # the short-lived `db upgrade` gets it as an argument. `db upgrade` can't be undone: dump the database before an
    # MLflow version bump.
    command:
      - sh
      - -c
      - >-
        mlflow db upgrade "$$MLFLOW_BACKEND_STORE_URI"
        && exec mlflow server --host 0.0.0.0 --port 5000 --workers 1
        --serve-artifacts --artifacts-destination "$$PI_MLFLOW_ARTIFACTS"
        --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
      - ${PI_GCP_CREDENTIALS_FILE:-/dev/null}:/var/run/gcp/adc.json:ro
    ports:
      - "127.0.0.1:${PI_MLFLOW_HOST_PORT:-5001}:5000" # the UI, from the host only (5000 is AirPlay on macOS)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      start_period: 120s
      retries: 10
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      postgres-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 10s
      retries: 20
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    networks: [default, docker-api]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 10s
      retries: 20
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_started
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      retries: 10
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      retries: 10
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  default:
    name: pi-airflow # the Airflow services and Postgres
  tasks:
    # pipeline task containers: Postgres (precursor_meta only, as pi_meta) and internet egress for CMS, nothing
    # else. They cannot reach the Airflow API server, the scheduler or the Docker proxy.
    name: pi-airflow-tasks
    enable_ipv6: false # the Postgres rule is IPv4 only
    ipam:
      config:
        - subnet: *tasks-subnet
  docker-api:
    internal: true

volumes:
  postgres-data:
  mlflow-artifacts:
  airflow-config:
  airflow-logs:
