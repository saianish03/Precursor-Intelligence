# The network-free toy pipeline: a toy silver world -> the real gold node -> a metrics summary.
# `uv run dvc repro` rebuilds whatever is out of date; `uv run dvc push` / `pull` share the data
# through gs://precursor-intel-mlops-data/dvc. Run order and outputs are documented in the README.
stages:
  # One stage, not silver and gold apart: gold writes run records into the same metadata database the
  # toy script creates, so a separate silver stage would show as modified after every gold run.
  # Only the byte-stable outputs are tracked; the manifest (built_at), _current.json and _staging
  # (run ids) change on every run, so they stay out of the declared outputs.
  toy_gold:
    cmd: >-
      rm -rf data/toy &&
      python tests/gold/make_toy_silver.py data/toy &&
      precursor-pipeline gold --env-file data/toy/env.yaml --splits-config data/toy/splits.yaml
    deps:
      - tests/gold/make_toy_silver.py
      - tests/gold/silver_fakes.py
      # Parquet outputs record the writer's library version, so a polars/pyarrow bump changes every hash.
      - uv.lock
      # What the toy gold run imports and loads, not all of src/ and configs/: a change elsewhere (validation,
      # agents, serving, other configs) must not make dvc.lock stale. gold imports ingestion (task_scope, Context).
      - src/precursorintelligence/common
      - src/precursorintelligence/gold
      - src/precursorintelligence/harmonize
      - src/precursorintelligence/ingestion
      - configs/ingestion/sources.yaml
      - configs/calibration.yaml
      - configs/column_map.yaml
      - configs/feature_registry.yaml
      - configs/features.yaml
      - configs/keep_columns.yaml
      - configs/labels.yaml
      - configs/logging.yaml
      - configs/qm_measures.yaml
      - configs/splits.yaml
      - configs/value_maps.yaml
    outs:
      - data/toy/silver
      - data/toy/gold/dim_facility_latest
      - data/toy/gold/spine
      - data/toy/gold/labels
      - data/toy/gold/features_citations
      - data/toy/gold/features_context
      - data/toy/gold/features_enforcement
      - data/toy/gold/features_facility_staffing
      - data/toy/gold/features_quality
      - data/toy/gold/features_survey_timing
      - data/toy/gold/facility_month_dataset
      - data/toy/gold/facility_month_dataset.parquet
  toy_summary:
    cmd: python scripts/dvc_gold_summary.py data/toy/gold metrics/toy_gold.json
    deps:
      - scripts/dvc_gold_summary.py
      - data/toy/gold/spine
      - data/toy/gold/labels
      - data/toy/gold/facility_month_dataset
    metrics:
      - metrics/toy_gold.json:
          cache: false
  # The ML smoke run (ML spec §16.2, course "training on code change"): the whole chain on the synthetic ML gold,
  # with the toy settings the fixture writes (<dir>/ml.yaml): train, validate, bias-check and gate, register in a
  # SQLite MLflow store, score and publish. It fails if a step fails, the gate holds or a step skips (the script's
  # docstring). Only the summary is tracked, and only its machine-independent facts: the run folder and the MLflow
  # store carry run ids. Its only output is committed, so plain `dvc repro` skips it when the lock is current:
  # CI forces it.
  toy_ml:
    cmd: python scripts/dvc_toy_ml.py data/toy_ml metrics/toy_ml.json
    deps:
      - tests/ml/make_ml_gold.py
      - scripts/dvc_toy_ml.py
      # the parquet hash (dataset_version) records the writer's library version
      - uv.lock
      # what the fixture and the `ml` commands import and load
      - src/precursorintelligence/agents  # imported by the precursor-pipeline entrypoint (the agents sub-app)
      - src/precursorintelligence/bias
      - src/precursorintelligence/common
      - src/precursorintelligence/evaluation
      - src/precursorintelligence/evidence  # imported by the precursor-pipeline entrypoint (the agents sub-app)
      - src/precursorintelligence/gold
      - src/precursorintelligence/harmonize
      - src/precursorintelligence/ingestion
      - src/precursorintelligence/monitoring
      - src/precursorintelligence/serving
      - src/precursorintelligence/training
      - src/precursorintelligence/validation  # imported by the precursor-pipeline entrypoint (harmonize/cli.py)
      - configs/bias_slices.yaml
      - configs/feature_registry.yaml
      - configs/labels.yaml
      - configs/logging.yaml
      - configs/ml.yaml
      - configs/reason_labels.yaml
      - configs/splits.yaml
    metrics:
      - metrics/toy_ml.json:
          cache: false
  # The agents' evidence (docs/AGENTS_PLAN.md E2): build-evidence on toy_ml's published month, with toy silver for
  # its citations and penalties (the toy chain has none), then a read-back through the agents' tools. It reads
  # data/toy_ml, which toy_ml doesn't declare as an output: metrics/toy_ml.json orders it after toy_ml, and CI forces
  # both. Like toy_ml, its only output is committed. After changing its inputs, force both
  # (`dvc repro --force --single-item toy_ml`, then `... toy_evidence`): a plain repro would reuse an old data/toy_ml.
  toy_evidence:
    cmd: python scripts/dvc_toy_evidence.py data/toy_ml metrics/toy_evidence.json
    deps:
      - scripts/dvc_toy_evidence.py
      - tests/agents/evidence_fakes.py
      - metrics/toy_ml.json
      - uv.lock
      # what build-evidence (through the precursor-pipeline entrypoint) and the read-back import and load
      - src/precursorintelligence/agents
      - src/precursorintelligence/bias
      - src/precursorintelligence/common
      - src/precursorintelligence/evaluation
      - src/precursorintelligence/evidence
      - src/precursorintelligence/gold
      - src/precursorintelligence/harmonize
      - src/precursorintelligence/ingestion
      - src/precursorintelligence/monitoring
      - src/precursorintelligence/serving
      - src/precursorintelligence/training
      - src/precursorintelligence/validation
      - configs/agents.yaml
      - configs/logging.yaml
      - configs/ml.yaml
    metrics:
      - metrics/toy_evidence.json:
          cache: false
