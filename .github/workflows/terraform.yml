name: Terraform

# A pull request that touches infra/ gets fmt + validate + plan, run as the read-only sa-tf-plan account.
# A merge into dev or main applies it, as sa-tf-apply. Both log in keylessly through workload identity
# federation; the pool only accepts tokens from this repository (docs/runbooks/gcp-bootstrap.md).
on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [dev, main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  id-token: write # the OIDC token that workload identity federation exchanges for Google credentials

# One run at a time against the state, and never cancel an apply that is already running.
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_WORKING_DIR: infra/terraform/envs/prod
  WIF_PROVIDER: projects/852874974077/locations/global/workloadIdentityPools/github/providers/github-repo

jobs:
  plan:
    if: github.event_name == 'pull_request'
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: sa-tf-plan@precursor-intel-mlops.iam.gserviceaccount.com

      # Prints the claims (never the token) GitHub sends, so a refused login can be diagnosed from the log.
      - name: Show the login claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://iam.googleapis.com/${{ env.WIF_PROVIDER }}" | jq -r .value)
          TOKEN="$TOKEN" python3 -c 'import os,json,base64; p=os.environ["TOKEN"].split(".")[1]; p+="="*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:c.get(k) for k in ("sub","repository","repository_owner","ref","event_name","job_workflow_ref")}, indent=2))'

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff
        working-directory: infra/terraform

      - name: Init
        run: terraform init -input=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Validate
        run: terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}

      # -lock=false: the plan account may read the state but not write it, and a lock is a write.
      - name: Plan
        run: |
          set -o pipefail
          terraform plan -input=false -lock=false -no-color | tee plan.txt
          { echo '### terraform plan'; echo '```'; tail -n 40 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        working-directory: ${{ env.TF_WORKING_DIR }}

  apply:
    if: github.event_name == 'push'
    name: apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: sa-tf-apply@precursor-intel-mlops.iam.gserviceaccount.com

      # Prints the claims (never the token) GitHub sends, so a refused login can be diagnosed from the log.
      - name: Show the login claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://iam.googleapis.com/${{ env.WIF_PROVIDER }}" | jq -r .value)
          TOKEN="$TOKEN" python3 -c 'import os,json,base64; p=os.environ["TOKEN"].split(".")[1]; p+="="*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({k:c.get(k) for k in ("sub","repository","repository_owner","ref","event_name","job_workflow_ref")}, indent=2))'

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      # Apply exactly the plan that was just made, never a second, different one.
      - name: Plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}

      # Nothing may be destroyed or replaced by CI. A deliberate removal is done by hand, by an owner.
      - name: Refuse destroys and replacements
        run: terraform show -json tfplan | jq -e '[.resource_changes[]?.change.actions[] | select(. == "delete")] | length == 0'
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Apply
        run: terraform apply -input=false -lock-timeout=5m tfplan
        working-directory: ${{ env.TF_WORKING_DIR }}
