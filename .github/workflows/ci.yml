name: CI

# Runs on every pull request into dev (feature work) and main (releases): lint and tests when the PR touches code,
# configs or tests (only the ML tests when it touches only ML code), plus the three images and the DAG tests when the
# PR touches them.
# Make the "ci-ok" check required in the branch rulesets: a PR can then merge only when every job passes.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20 # measured on #70: pytest ~6.2 min on 4 workers, jobs 6.6 (3.11) and 7.7 min (3.12, + toy_ml chain)
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the merge commit and its base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      # On a PR, HEAD is the merge commit and HEAD^1 the base branch, so this diff is exactly the PR's changes.
      # none: nothing that can change a test result (docs, infra, docker/: the images job builds those);
      # ml: only ML code, configs or tests. ML code imports gold, bias and ingestion, so a change there runs
      # everything; the data packages import no ML code except the precursor-pipeline CLI (harmonize/cli.py), so the
      # ML set keeps tests/harmonize (and tests/alerts: the ML run email). all: everything else, and every manual run.
      - name: Which tests does the change need?
        id: scope
        env:
          CODE: '^(src/|tests/|configs/|scripts/|dags/|backend/|frontend/|pyproject\.toml$|uv\.lock$|requirements\.txt$|\.python-version$|dvc\.(yaml|lock)$|metrics/|\.github/workflows/ci\.yml$)'
          ML: '^(src/precursorintelligence/(training|evaluation|serving|monitoring)/|tests/(training|evaluation|serving|monitoring|ml)/|tests/leakage/test_ml_[a-z_]+\.py$|configs/(ml|reason_labels)\.yaml$|scripts/(dvc_toy_ml|ml_checkpoint_reasons)\.py$|dags/cms_nh_ml\.py$|dvc\.lock$|metrics/toy_ml\.json$)'
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            scope=all
          else
            code=$(git diff --name-only HEAD^1 HEAD | grep -E "$CODE" || true)
            if [ -z "$code" ]; then
              scope=none
            elif grep -vqE "$ML" <<< "$code"; then
              scope=all
            else
              scope=ml
            fi
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Test scope: **$scope**" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up uv and Python
        if: steps.scope.outputs.scope != 'none'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Exact versions from uv.lock; the dev group is installed by default. All extras, so tests for every
      # stage can import their libraries. setup-uv's python-version (UV_PYTHON) overrides .python-version.
      - name: Install the package, all extras and dev tools
        if: steps.scope.outputs.scope != 'none'
        run: uv sync --frozen --all-extras

      # requirements.txt is the pip route to the same versions as uv.lock (the course asks for one). It fails
      # when stale: run the command in the error message and commit the file.
      - name: requirements.txt matches uv.lock
        if: steps.scope.outputs.scope != 'none'
        run: |
          uv export --frozen --no-hashes --no-header --extra pipeline --extra ml --extra bias --extra dvc | diff - requirements.txt \
            || { echo "::error::requirements.txt is stale: uv export --frozen --no-hashes --no-header --extra pipeline --extra ml --extra bias --extra dvc -o requirements.txt"; exit 1; }

      - name: Lint (ruff)
        if: steps.scope.outputs.scope != 'none'
        run: uv run ruff check src tests

      # One worker per vCPU (4 on GitHub's runner; `auto` would count its 2 physical cores); --dist loadfile keeps each file's module and session
      # fixtures computed once. Locally: `uv run pytest -n auto --dist loadfile`.
      - name: Unit tests (offline; live CMS tests are excluded)
        if: steps.scope.outputs.scope != 'none'
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
          # one thread per worker: polars, BLAS (numpy/scipy) and OpenMP (LightGBM without num_threads) would each start
          # one per vCPU in every worker, oversubscribing the runner
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          POLARS_MAX_THREADS: "1"
        run: |
          set +e
          paths=()
          if [ "$SCOPE" = ml ]; then
            paths=(tests/training tests/evaluation tests/serving tests/monitoring tests/leakage/test_ml_*.py
                   tests/harmonize tests/common tests/contracts tests/alerts)
          fi
          uv run pytest -q -n logical --dist loadfile "${paths[@]}"
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "::notice::No tests were collected; treating as success."
            exit 0
          fi
          exit $code

      # The toy pipelines are network-free, so CI can rebuild them from scratch (no GCS credentials: nothing is
      # pushed or pulled). toy_ml is the ML smoke run: train, validate, bias-check, gate, register (a SQLite
      # MLflow store on the runner), score and publish on every PR; a failed step, or a gate that holds the
      # model (validation or bias), fails this step. It is forced: its only output is committed, so a plain
      # repro skips it whenever dvc.lock is current. A stale dvc.lock is a warning, not a failure: it depends on
      # all of src/ and configs/, so most PRs would otherwise have to regenerate it. Once, on 3.12 (the images'
      # Python): the toy run is the same on both.
      - name: DVC pipeline reproduces (toy world)
        if: steps.scope.outputs.scope != 'none' && matrix.python-version == '3.12'
        run: |
          uv run dvc repro --force --single-item toy_ml
          uv run dvc repro
          if ! git diff --exit-code --quiet dvc.lock metrics; then
            echo "::warning::dvc.lock or metrics/ changed after dvc repro; run 'uv run dvc repro' and commit them."
          fi

  # cd.yml repeats this job's checks on the images it pushes: change both together.
  # Builds the three images and runs tests/dags inside the Airflow image (Airflow is not a repo dependency, so the
  # tests job skips them). Nothing is pushed: the images stay on the runner. The job always runs, because
  # ci-ok needs it; its first step skips the rest when the PR changes nothing that goes into an image or a DAG.
  images:
    name: images + DAG tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the merge commit and its base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      # On a PR, HEAD is the merge commit and HEAD^1 the base branch, so this diff is exactly the PR's changes.
      - name: Does the change touch an image or a DAG?
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD \
              | grep -qE '^(docker/|dags/|tests/dags/|src/|configs/|\.dockerignore$|pyproject\.toml$|uv\.lock$|\.github/workflows/ci\.yml$)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No image or DAG changes: nothing to build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the pipeline image
        if: steps.changes.outputs.build == 'true'
        run: docker build -f docker/pipeline.Dockerfile --build-arg PI_GIT_SHA="$GITHUB_SHA" -t precursor-pipeline:ci .

      - name: Build the Airflow image
        if: steps.changes.outputs.build == 'true'
        run: docker build -f docker/airflow.Dockerfile -t precursor-airflow:ci .

      - name: Build the MLflow image
        if: steps.changes.outputs.build == 'true'
        run: docker build -f docker/mlflow.Dockerfile --build-arg PI_GIT_SHA="$GITHUB_SHA" -t precursor-mlflow:ci .

      # precursor-pipeline --help imports every node's CLI, so a dependency missing from the pipeline extra fails here.
      - name: The pipeline image runs its CLIs and records the commit
        if: steps.changes.outputs.build == 'true'
        run: |
          docker run --rm precursor-pipeline:ci precursor-ingest --help > /dev/null
          docker run --rm precursor-pipeline:ci precursor-pipeline --help > /dev/null
          docker run --rm precursor-pipeline:ci python -c "import fairlearn, lightgbm, mlflow, optuna, shap, sklearn"
          test "$(docker run --rm precursor-pipeline:ci printenv PI_GIT_SHA)" = "$GITHUB_SHA"

      # The server's flags exist in this MLflow version (the compose command uses them), and so do its two drivers.
      - name: The MLflow image has the server, the GCS client and the Postgres driver
        if: steps.changes.outputs.build == 'true'
        run: |
          help=$(docker run --rm precursor-mlflow:ci mlflow server --help)
          for flag in --allowed-hosts --serve-artifacts --artifacts-destination --workers; do
            grep -q -- "$flag" <<< "$help" || { echo "::error::mlflow server has no $flag"; exit 1; }
          done
          docker run --rm precursor-mlflow:ci python -c "import google.cloud.storage, psycopg2"

      # Against the DAGs baked into the image, as it ships: only tests/dags is mounted (it is not part of the image).
      - name: DAG tests inside the Airflow image
        if: steps.changes.outputs.build == 'true'
        run: |
          docker run --rm --entrypoint "" -v "$PWD/tests/dags:/opt/airflow/tests/dags:ro" \
            precursor-airflow:ci python -m pytest -q -p no:cacheprovider /opt/airflow/tests/dags

      # The compose bundle the VM deploys from, checked the way the VM uses it: the base file plus the VM file (never
      # the laptop override), with init-db.sh executable. The base file alone must still need only a laptop's five
      # secrets. The values are dummies: `config -q` only needs them set.
      - name: The compose bundle in the Airflow image works on its own
        if: steps.changes.outputs.build == 'true'
        run: |
          cid=$(docker create precursor-airflow:ci) && docker cp "$cid:/opt/precursor/compose" bundle && docker rm "$cid"
          test -x bundle/init-db.sh
          export AIRFLOW_DB_PASSWORD=x PI_META_DB_PASSWORD=x AIRFLOW_JWT_SECRET=x AIRFLOW_FERNET_KEY=x MLFLOW_DB_PASSWORD=x
          docker compose -f bundle/docker-compose.yaml config -q
          export AIRFLOW_API_SECRET_KEY=x PI_RELEASE_SHA=x PI_ALERT_EMAIL_TO=x PI_ALERT_SMTP_USER=x \
            PI_ALERT_SMTP_PASSWORD=x
          docker compose -f bundle/docker-compose.yaml -f bundle/docker-compose.vm.yaml config -q
          # every Airflow service must take its image from the VM file, never a laptop's `latest`
          if docker compose -f bundle/docker-compose.yaml -f bundle/docker-compose.vm.yaml config --images | grep ':latest$'; then
            echo "::error::the VM compose config names a :latest image: a service missing from docker-compose.vm.yaml?"
            exit 1
          fi

      # The bundle really runs on a new database: airflow-init (migrate + the pool `heavy`), postgres-setup's SQL, the
      # server's command and health check, a client on the task network logging a run and reading its artifact back,
      # and the task network's limits (L11): no airflow login, and mlflow only on its own database.
      - name: MLflow and airflow-init run in the compose bundle, within the task network's limits
        if: steps.changes.outputs.build == 'true'
        run: |
          export AIRFLOW_DB_PASSWORD=x PI_META_DB_PASSWORD=x AIRFLOW_JWT_SECRET=x AIRFLOW_FERNET_KEY=x \
            MLFLOW_DB_PASSWORD=x PI_MLFLOW_IMAGE=precursor-mlflow:ci PI_AIRFLOW_IMAGE=precursor-airflow:ci
          compose() { docker compose -f bundle/docker-compose.yaml "$@"; }
          trap 'compose logs --tail 50 airflow-init postgres-setup mlflow; compose down -v' EXIT
          compose up -d --wait --wait-timeout 300 mlflow airflow-init
          # as the airflow user (airflow-init runs as root, whose Python has no airflow)
          compose run --rm --no-deps --entrypoint "" airflow-apiserver airflow pools get heavy -o plain \
            | grep -Eq '^heavy +1 '
          login() { docker run --rm --network pi-airflow-tasks -e PGPASSWORD=x postgres:16.10 \
            psql -h postgres -U "$1" -d "$2" -tAc 'SELECT 1' > /dev/null 2>&1; }
          ! login airflow airflow || { echo "::error::the task network can log in as airflow"; exit 1; }
          ! login mlflow precursor_meta || { echo "::error::mlflow can reach precursor_meta"; exit 1; }
          login mlflow mlflow || { echo "::error::mlflow can't reach its own database"; exit 1; }
          docker run --rm --network pi-airflow-tasks -e MLFLOW_TRACKING_URI=http://mlflow:5000 \
            precursor-pipeline:ci python -c "
          import mlflow, urllib.request
          assert urllib.request.urlopen('http://mlflow:5000/health').status == 200
          mlflow.set_experiment('ci-smoke')
          with mlflow.start_run() as run:
              mlflow.log_metric('ok', 1)
              mlflow.log_text('hello', 'hello.txt')
          assert mlflow.artifacts.load_text(f'runs:/{run.info.run_id}/hello.txt') == 'hello'
          "

      - name: Image sizes
        if: steps.changes.outputs.build == 'true'
        run: |
          {
            echo "| image | size |"
            echo "|---|---|"
            docker image ls --filter reference='precursor-*:ci' --format '| {{.Repository}} | {{.Size}} |'
          } >> "$GITHUB_STEP_SUMMARY"

  # Single stable check name to require in the branch rulesets (independent of the Python matrix).
  ci-ok:
    name: ci-ok
    needs: [tests, images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          if [ "${{ needs.tests.result }}" != "success" ] || [ "${{ needs.images.result }}" != "success" ]; then
            echo "tests job result: ${{ needs.tests.result }}; images job result: ${{ needs.images.result }}"
            exit 1
          fi
