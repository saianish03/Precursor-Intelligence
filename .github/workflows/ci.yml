name: CI

# Runs on every pull request into dev (feature work) and main (releases).
# Make the "ci-ok" check required in the branch rulesets: a PR can then merge only when lint and tests pass.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out the merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Exact versions from uv.lock; the dev group is installed by default. All extras, so tests for every
      # stage can import their libraries. setup-uv's python-version (UV_PYTHON) overrides .python-version.
      - name: Install the package, all extras and dev tools
        run: uv sync --frozen --all-extras

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Unit tests (offline; live CMS tests are excluded)
        run: |
          set +e
          uv run pytest -q
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "::notice::No tests were collected; treating as success."
            exit 0
          fi
          exit $code

      # The toy pipeline is network-free, so CI can rebuild it from scratch (no GCS credentials: nothing is
      # pushed or pulled). The step fails only if the pipeline cannot run. A stale dvc.lock is a warning, not a
      # failure: it depends on all of src/ and configs/, so most PRs would otherwise have to regenerate it.
      - name: DVC pipeline reproduces (toy world)
        run: |
          uv run dvc repro
          if ! git diff --exit-code --quiet dvc.lock metrics; then
            echo "::warning::dvc.lock or metrics/ changed after dvc repro; run 'uv run dvc repro' and commit them."
          fi

  # Single stable check name to require in the branch rulesets (independent of the Python matrix).
  ci-ok:
    name: ci-ok
    needs: [tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          if [ "${{ needs.tests.result }}" != "success" ]; then
            echo "tests job result: ${{ needs.tests.result }}"
            exit 1
          fi
