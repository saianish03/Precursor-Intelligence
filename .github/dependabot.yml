# Keeps the pinned GitHub Action SHAs and the Dockerfiles' base-image digests current: one weekly pull request each,
# reviewed like any other change. (The uv binary copied in with COPY --from is bumped by hand.)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /docker
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
