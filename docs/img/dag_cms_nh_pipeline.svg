<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .ttl { font-size: 20px; font-weight: 600; fill: #202124; }
      .sub { font-size: 13px; fill: #5f6368; }
      .cap { font-size: 12px; fill: #5f6368; }
      .grp { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; fill: #5f6368; }
      .frame { fill: none; stroke: #9aa0a6; stroke-width: 1; }
      .frame-solid { fill: #fafbfc; stroke: #c4c9cf; stroke-width: 1; }
      .frame-dash { fill: none; stroke: #9aa0a6; stroke-width: 1; stroke-dasharray: 5 4; }
      .tile { fill: #ffffff; stroke: #c4c9cf; stroke-width: 1; }
      .ic { fill: none; stroke: #3c4043; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .wire { fill: none; stroke: #5f6368; stroke-width: 1.5; marker-end: url(#dah); }
      .wire-acc { fill: none; stroke: #1a73e8; stroke-width: 1.8; marker-end: url(#daha); }
      .wire-planned { fill: none; stroke: #5f6368; stroke-width: 1.5; stroke-dasharray: 5 4; marker-end: url(#dah); }
      .dg-name { font-family: Consolas, "Cascadia Mono", Menlo, monospace; font-size: 11px; fill: #202124; }
      .dg-asset { font-family: Consolas, "Cascadia Mono", Menlo, monospace; font-size: 10.5px; fill: #1a73e8; }
      .dg-mapped { font-size: 12px; font-weight: 700; fill: #5f6368; }
      .dg-teardown { fill: none; stroke: #6b5ba8; stroke-width: 1.4; stroke-dasharray: 3 4; marker-end: url(#dah); }

      .flowing { stroke-dasharray: 9 6; animation: pi-flow 0.9s linear infinite; }
      @keyframes pi-flow { to { stroke-dashoffset: -15; } }
      @media (prefers-reduced-motion: reduce) { .flowing { animation: none; stroke-dasharray: none; } }

      .dg-status { fill: #dadce0; }
      .task.planned .dg-status { fill: none; stroke: #9aa0a6; stroke-dasharray: 2 2; }
      .task:not(.planned) .dg-status { animation: dg-run 16s linear infinite; }
      @keyframes dg-run {
        0% { fill: #34a853; opacity: 1; }
        3% { fill: #34a853; opacity: 0.35; }
        6% { fill: #188038; opacity: 1; }
        92% { fill: #188038; opacity: 1; }
        96%, 100% { fill: #dadce0; opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) { .task:not(.planned) .dg-status { animation: none; fill: #188038; } }
      [data-task="acquire_lock"] .dg-status { animation-delay: 0.0s; }
      [data-task="discover_download"] .dg-status { animation-delay: 1.1s; }
      [data-task="pending_entries"] .dg-status { animation-delay: 2.2s; }
      [data-task="extract_inventory"] .dg-status { animation-delay: 3.3s; }
      [data-task="resolve_report"] .dg-status { animation-delay: 4.4s; }
      [data-task="check_anomalies"] .dg-status { animation-delay: 5.5s; }
      [data-task="load_bronze"] .dg-status { animation-delay: 6.6s; }
      [data-task="build_silver"] .dg-status { animation-delay: 7.7s; }
      [data-task="validate_silver"] .dg-status { animation-delay: 8.8s; }
      [data-task="build_gold"] .dg-status { animation-delay: 9.9s; }
      [data-task="validate_gold"] .dg-status { animation-delay: 11.0s; }
      [data-task="release_lock"] .dg-status { animation-delay: 12.1s; }
    </style>
    <marker id="dah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5f6368" stroke-width="1.6"/></marker>
    <marker id="daha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#1a73e8" stroke-width="1.8"/></marker>

    <symbol id="d-gate" viewBox="0 0 48 48"><path class="ic" d="M24 6 L42 24 L24 42 L6 24 Z M18 24 H30 M24 18 V30"/></symbol>
    <symbol id="d-lock" viewBox="0 0 48 48"><path class="ic" d="M12 22 H36 V42 H12 Z M17 22 V15 C17 7 31 7 31 15 V22 M24 30 V34"/></symbol>
    <symbol id="d-unlock" viewBox="0 0 48 48"><path class="ic" d="M12 22 H36 V42 H12 Z M17 22 V15 C17 7 31 7 31 12 M24 30 V34"/></symbol>
    <symbol id="d-download" viewBox="0 0 48 48"><path class="ic" d="M24 6 V28 M15 20 L24 29 L33 20 M8 30 V40 H40 V30"/></symbol>
    <symbol id="d-list" viewBox="0 0 48 48"><path class="ic" d="M17 12 H40 M17 24 H40 M17 36 H40 M8 12 H10 M8 24 H10 M8 36 H10"/></symbol>
    <symbol id="d-extract" viewBox="0 0 48 48"><path class="ic" d="M8 18 H40 V40 H8 Z M8 18 L14 8 H34 L40 18 M24 24 V34 M19 29 L24 34 L29 29"/></symbol>
    <symbol id="d-check" viewBox="0 0 48 48"><path class="ic" d="M10 8 H38 V40 H10 Z M16 18 L20 22 L27 14 M16 32 H32"/></symbol>
    <symbol id="d-search" viewBox="0 0 48 48"><circle class="ic" cx="21" cy="21" r="12"/><path class="ic" d="M30 30 L40 40"/></symbol>
    <symbol id="d-bell" viewBox="0 0 48 48"><path class="ic" d="M14 32 V22 C14 15 18 11 24 11 C30 11 34 15 34 22 V32 L37 35 H11 Z M21 39 C22 41 26 41 27 39"/></symbol>
    <symbol id="d-layers" viewBox="0 0 48 48"><path class="ic" d="M24 8 L42 17 L24 26 L6 17 Z M6 25 L24 34 L42 25 M6 33 L24 42 L42 33"/></symbol>
    <symbol id="d-filter" viewBox="0 0 48 48"><path class="ic" d="M7 9 H41 L28 25 V39 L20 43 V25 Z"/></symbol>
    <symbol id="d-table" viewBox="0 0 48 48"><path class="ic" d="M7 9 H41 V39 H7 Z M7 18 H41 M7 27 H41 M19 18 V39 M30 18 V39"/></symbol>
    <symbol id="d-shield" viewBox="0 0 48 48"><path class="ic" d="M24 6 L39 12 V23 C39 33 32 39 24 42 C16 39 9 33 9 23 V12 Z M17 24 L22 29 L31 19"/></symbol>
    <symbol id="d-model" viewBox="0 0 48 48"><circle class="ic" cx="10" cy="14" r="3.5"/><circle class="ic" cx="10" cy="34" r="3.5"/><circle class="ic" cx="24" cy="24" r="3.5"/><circle class="ic" cx="38" cy="14" r="3.5"/><circle class="ic" cx="38" cy="34" r="3.5"/><path class="ic" d="M13 15 L21 22 M13 33 L21 26 M27 22 L35 15 M27 26 L35 33"/></symbol>
  </defs>
  <rect width="1800" height="520" fill="#ffffff"/>
  <text x="40" y="36" class="ttl">Airflow DAG · cms_nh_pipeline</text>
  <text x="40" y="508" class="cap">Status dots replay a simulated run in DAG order.</text>
  <text x="1760" y="36" class="sub" text-anchor="end">daily on the GCP VM · manual on a laptop · max_active_runs = 1</text>
  <line x1="40" y1="52" x2="1760" y2="52" stroke="#dadce0"/>

  <!-- task group frames -->
  <rect x="24" y="112" width="144" height="170" class="frame-dash"/>
  <text x="36" y="130" class="grp">PLANNED</text>
  <rect x="200" y="112" width="700" height="318" class="frame-solid"/>
  <text x="212" y="130" class="grp">TASKGROUP · INGESTION</text>
  <rect x="930" y="112" width="144" height="186" class="frame-solid"/>
  <text x="942" y="130" class="grp">BRONZE</text>
  <rect x="1110" y="112" width="144" height="318" class="frame-solid"/>
  <text x="1122" y="130" class="grp">SILVER</text>
  <rect x="1290" y="112" width="144" height="318" class="frame-solid"/>
  <text x="1302" y="130" class="grp">GOLD</text>
  <rect x="1624" y="112" width="144" height="170" class="frame-dash"/>
  <text x="1636" y="130" class="grp">DOWNSTREAM</text>

  <!-- dependencies -->
  <path d="M152,208 H222" class="wire-planned"/>
  <path d="M336,208 H358" class="wire flowing"/>
  <path d="M472,208 H494" class="wire flowing"/>
  <path d="M608,208 H622" class="wire flowing"/>
  <path d="M744,208 H766" class="wire flowing"/>
  <path d="M866,246 V316" class="wire flowing"/>
  <path d="M768,356 H746" class="wire"/>
  <path d="M880,208 H944" class="wire-acc flowing"/>
  <path d="M1058,208 H1124" class="wire-acc flowing"/>
  <path d="M1226,246 V316" class="wire flowing"/>
  <path d="M1238,356 H1272 V208 H1304" class="wire-acc flowing"/>
  <path d="M1406,246 V316" class="wire flowing"/>
  <path d="M1418,342 H1450 V208 H1638" class="wire-planned" style="stroke:#1a73e8"/>
  <path d="M1418,378 H1468" class="wire flowing"/>
  <path d="M234,246 V472 H1566 V396" class="dg-teardown"/>
  <text x="700" y="490" class="cap" text-anchor="middle">teardown of acquire_lock · runs after a failure too, never hides one</text>

  <!-- asset labels -->
  <text x="246" y="420" class="dg-asset">emits cms_nh_landing</text>
  <text x="1002" y="286" class="dg-asset" text-anchor="middle">emits cms_nh_bronze</text>
  <text x="1182" y="427" class="dg-asset" text-anchor="middle">emits cms_nh_silver</text>
  <text x="1362" y="427" class="dg-asset" text-anchor="middle">emits cms_nh_gold</text>
  <text x="1544" y="198" class="cap" text-anchor="middle">when published + valid</text>

  <!-- tasks -->
    <g class="task planned" data-task="check_release">
      <rect x="40" y="170" width="112" height="76" rx="4" class="tile task-tile" stroke-dasharray="4 3"/>
      <use href="#d-gate" x="81" y="180" width="30" height="30"/>
      <text x="96" y="230" class="dg-name" text-anchor="middle">check_release</text>
      <circle cx="142" cy="180" r="5" class="dg-status"/>
      <text x="96" y="264" class="cap" text-anchor="middle">release gate</text>
    </g>
    <g class="task" data-task="acquire_lock">
      <rect x="224" y="170" width="112" height="76" rx="4" class="tile task-tile"/>
      <use href="#d-lock" x="265" y="180" width="30" height="30"/>
      <text x="280" y="230" class="dg-name" text-anchor="middle">acquire_lock</text>
      <circle cx="326" cy="180" r="5" class="dg-status"/>
      <text x="280" y="264" class="cap" text-anchor="middle">run lock</text>
    </g>
    <g class="task" data-task="discover_download">
      <rect x="360" y="170" width="112" height="76" rx="4" class="tile task-tile"/>
      <use href="#d-download" x="401" y="180" width="30" height="30"/>
      <text x="416" y="230" class="dg-name" text-anchor="middle">discover_download</text>
      <circle cx="462" cy="180" r="5" class="dg-status"/>
      <text x="416" y="264" class="cap" text-anchor="middle">CMS → landing</text>
    </g>
    <g class="task" data-task="pending_entries">
      <rect x="496" y="170" width="112" height="76" rx="4" class="tile task-tile"/>
      <use href="#d-list" x="537" y="180" width="30" height="30"/>
      <text x="552" y="230" class="dg-name" text-anchor="middle">pending_entries</text>
      <circle cx="598" cy="180" r="5" class="dg-status"/>
      <text x="552" y="264" class="cap" text-anchor="middle">zips to process</text>
    </g>
    <g class="task" data-task="extract_inventory">
      <rect x="640" y="162" width="112" height="76" rx="4" class="tile"/>
      <rect x="636" y="166" width="112" height="76" rx="4" class="tile"/>
      <rect x="632" y="170" width="112" height="76" rx="4" class="tile task-tile"/>
      <use href="#d-extract" x="673" y="180" width="30" height="30"/>
      <text x="688" y="230" class="dg-name" text-anchor="middle">extract_inventory</text>
      <circle cx="734" cy="180" r="5" class="dg-status"/>
      <text x="688" y="264" class="cap" text-anchor="middle">one per zip</text>
      <text x="746" y="158" class="dg-mapped">×N</text>
    </g>
    <g class="task" data-task="resolve_report">
      <rect x="768" y="170" width="112" height="76" rx="4" class="tile task-tile"/>
      <use href="#d-check" x="809" y="180" width="30" height="30"/>
      <text x="824" y="230" class="dg-name" text-anchor="middle">resolve_report</text>
      <circle cx="870" cy="180" r="5" class="dg-status"/>
      <text x="824" y="264" class="cap" text-anchor="middle">one file / month</text>
    </g>
    <g class="task" data-task="check_anomalies">
      <rect x="768" y="318" width="112" height="76" rx="4" class="tile task-tile"/>
      <use href="#d-search" x="809" y="328" width="30" height="30"/>
      <text x="824" y="378" class="dg-name" text-anchor="middle">check_anomalies</text>
      <circle cx="870" cy="328" r="5" class="dg-status"/>
      <text x="824" y="412" class="cap" text-anchor="middle">new errors?</text>
    </g>
    <g class="task" data-task="alert_anomalies">
      <rect x="632" y="318" width="112" height="76" rx="4" class="tile task-tile"/>
      <use href="#d-bell" x="673" y="328" width="30" height="30"/>
      <text x="688" y="378" class="dg-name" text-anchor="middle">alert_anomalies</text>
      <circle cx="734" cy="328" r="5" class="dg-status"/>
      <text x="688" y="412" class="cap" text-anchor="middle">email</text>
    </g>
    <g class="task" data-task="load_bronze">
      <rect x="946" y="170" width="112" height="76" rx="4" class="tile task-tile"/>
      <use href="#d-layers" x="987" y="180" width="30" height="30"/>
      <text x="1002" y="230" class="dg-name" text-anchor="middle">load_bronze</text>
      <circle cx="1048" cy="180" r="5" class="dg-status"/>
      <text x="1002" y="264" class="cap" text-anchor="middle">raw → Parquet</text>
    </g>
    <g class="task" data-task="build_silver">
      <rect x="1126" y="170" width="112" height="76" rx="4" class="tile task-tile"/>
      <use href="#d-filter" x="1167" y="180" width="30" height="30"/>
      <text x="1182" y="230" class="dg-name" text-anchor="middle">build_silver</text>
      <circle cx="1228" cy="180" r="5" class="dg-status"/>
      <text x="1182" y="264" class="cap" text-anchor="middle">clean · ledgers</text>
    </g>
    <g class="task" data-task="validate_silver">
      <rect x="1126" y="318" width="112" height="76" rx="4" class="tile task-tile"/>
      <use href="#d-shield" x="1167" y="328" width="30" height="30"/>
      <text x="1182" y="378" class="dg-name" text-anchor="middle">validate_silver</text>
      <circle cx="1228" cy="328" r="5" class="dg-status"/>
      <text x="1182" y="410" class="cap" text-anchor="middle">schema · drift</text>
    </g>
    <g class="task" data-task="build_gold">
      <rect x="1306" y="170" width="112" height="76" rx="4" class="tile task-tile"/>
      <use href="#d-table" x="1347" y="180" width="30" height="30"/>
      <text x="1362" y="230" class="dg-name" text-anchor="middle">build_gold</text>
      <circle cx="1408" cy="180" r="5" class="dg-status"/>
      <text x="1362" y="264" class="cap" text-anchor="middle">build · gate</text>
    </g>
    <g class="task" data-task="validate_gold">
      <rect x="1306" y="318" width="112" height="76" rx="4" class="tile task-tile"/>
      <use href="#d-shield" x="1347" y="328" width="30" height="30"/>
      <text x="1362" y="378" class="dg-name" text-anchor="middle">validate_gold</text>
      <circle cx="1408" cy="328" r="5" class="dg-status"/>
      <text x="1362" y="410" class="cap" text-anchor="middle">schema check</text>
    </g>
    <g class="task" data-task="release_lock">
      <rect x="1470" y="318" width="112" height="76" rx="4" class="tile task-tile"/>
      <use href="#d-unlock" x="1511" y="328" width="30" height="30"/>
      <text x="1526" y="378" class="dg-name" text-anchor="middle">release_lock</text>
      <circle cx="1572" cy="328" r="5" class="dg-status"/>
      <text x="1526" y="412" class="cap" text-anchor="middle">teardown</text>
    </g>
    <g class="task planned" data-task="ml_dags">
      <rect x="1640" y="170" width="112" height="76" rx="4" class="tile task-tile" stroke-dasharray="4 3"/>
      <use href="#d-model" x="1681" y="180" width="30" height="30"/>
      <text x="1696" y="230" class="dg-name" text-anchor="middle">ML DAGs</text>
      <circle cx="1742" cy="180" r="5" class="dg-status"/>
      <text x="1696" y="264" class="cap" text-anchor="middle">train · score</text>
    </g>

  <g transform="translate(1624,330)">
    <rect x="0" y="0" width="144" height="128" class="frame"/>
    <text x="12" y="18" class="grp">TASK STATE</text>
    <circle cx="20" cy="40" r="5" fill="#dadce0"/><text x="32" y="44" class="cap">queued</text>
    <circle cx="20" cy="62" r="5" fill="#34a853"/><text x="32" y="66" class="cap">running</text>
    <circle cx="20" cy="84" r="5" fill="#188038"/><text x="32" y="88" class="cap">success</text>
    <rect x="12" y="100" width="16" height="14" rx="2" fill="none" stroke="#5f6368" stroke-dasharray="3 2"/><text x="32" y="111" class="cap">planned</text>
  </g>
</svg>