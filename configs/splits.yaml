# Spine and split rules for gold (docs/DATA_PIPELINE_SPEC.md §7, §9.3, §9.5).
# Per label, windows are calendar months ending at last_labeled_t = V - (H + B): test = the last test_months
# months, purge = the H months before test, calib = the calib_months before purge, train = from spine_start up to
# calib; every later row is score. Recomputed from V on every run.

spine_start: "2022-01"   # first prediction month t, and where training starts; 2021 is history only
                         # (spec §14 #10, decided 2026-11-10 for the ML eval window: ML_PIPELINE_SPEC.md §5)
test_months: 3           # §14 #11 considered 6 with a 2022-01 start; kept at 3: the ML spec uses gold's test window as is
calib_months: 3
required_labels: [g12, g6]   # gold stops (exit 2) unless each has a positive and a negative training row; pen12 is reported only
