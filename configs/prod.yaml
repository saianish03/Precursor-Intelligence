# Test / production (GCP): GCS bucket for files (gcsfs, `pipeline` extra). Metadata: Postgres via PI_DATABASE_URL
# (the `precursor_meta` database on the Airflow VM; BigQuery only holds a read-only mirror, spec 0.6).
# Credentials come from Application Default Credentials / workload identity, never from this file.
env: prod
object_store:
  kind: gcs
  root: ${PI_BUCKET_URI:-gs://precursor-intel-mlops-data}
  # No bucket retention policy: this one root also holds layers that are rewritten (bronze reloads,
  # gold promotion, reports) and quarantine files that are deleted. Landing is protected by the code's
  # never-overwrite rule plus bucket object versioning (spec §0.6; decided 2026-10-16).
  immutable: object_versioning
  # gcsfs: google.auth.default() (the VM's identity, or a mounted gcloud ADC file on a laptop) or an error,
  # never gcsfs's silent anonymous fallback, which only shows up later as 401s
  storage_options:
    token: google_default
metadata_store:
  url: ${PI_DATABASE_URL}
table_sink:
  kind: parquet
  prefix: bronze
logging:
  config: configs/logging.yaml
  log_dir: /tmp/precursorintelligence-logs
  console_format: json                     # stdout JSON -> Cloud Logging
run_lock:
  stale_after_hours: 12                    # a lock older than this was left by a killed run
