# Test / production (GCP): GCS bucket for files (gcsfs, `pipeline` extra). Metadata: Postgres via PI_DATABASE_URL
# (the `precursor_meta` database on the Airflow VM; BigQuery only holds a read-only mirror, spec 0.6).
# Credentials come from Application Default Credentials / workload identity, never from this file.
env: prod
object_store:
  kind: gcs
  root: ${PI_BUCKET_URI:-gs://precursor-intel-mlops-data}
  # No bucket retention policy: this one root also holds layers that are rewritten (bronze reloads,
  # gold promotion, reports) and quarantine files that are deleted. Landing is protected by the code's
  # never-overwrite rule plus bucket object versioning (spec §0.6; decided 2026-10-16).
  immutable: object_versioning
  # gcsfs: google.auth.default() (the VM's identity, or a mounted gcloud ADC file on a laptop) or an error,
  # never gcsfs's silent anonymous fallback, which only shows up later as 401s
  storage_options:
    token: google_default
# Registered model versions' packages (ML spec §9.4): write-once copies, by run, in the MLflow bucket (versioned,
# prevent_destroy, never expired), so a version scores and rolls back after its run folder is gone. Outside
# MLflow's artifact prefix (PI_MLFLOW_ARTIFACTS), which the server, with no login, writes for anyone who reaches it.
# One sibling prefix per stack and no default, so a stack that forgets it stops instead of writing into another's:
# packages/vm on the VM (docker-compose.vm.yaml), packages/ml-dev on the laptop stack. Unset: no package store, and
# the ML tasks that need one exit 3; ingestion, silver and gold never build it.
package_store:
  kind: gcs
  root: ${PI_PACKAGES_URI:-}
  immutable: object_versioning
  storage_options:
    token: google_default
metadata_store:
  url: ${PI_DATABASE_URL}
table_sink:
  kind: parquet
  prefix: bronze
logging:
  config: configs/logging.yaml
  log_dir: /tmp/precursorintelligence-logs
  console_format: json                     # stdout JSON -> Cloud Logging
run_lock:
  stale_after_hours: 12                    # a lock older than this was left by a killed run
# The month's scores, loaded by `ml publish` (ML spec §11 Phase 2); the dataset and its tables are Terraform's, with
# the schemas in configs/bigquery/. Load jobs only: free, and no query runs here. No default, like the package store:
# only the VM sets PI_BIGQUERY_DATASET (docker-compose.vm.yaml), so a laptop stack on ml-dev/ loads nothing into it.
# meta_dataset: the read-only copy of this env's metadata store, replaced by `mirror-metadata` at the end of each DAG
# run (data spec §0.6). It goes with the block, so a laptop stack or a trial prefix (dataset blank) mirrors nothing;
# exporting PI_BIGQUERY_DATASET by hand on a laptop would mirror the laptop's database over the VM's copy.
bigquery:
  project: precursor-intel-mlops
  dataset: ${PI_BIGQUERY_DATASET:-}
  meta_dataset: precursorintelligence_meta
  location: us-central1
