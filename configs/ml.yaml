# The ML pipeline's settings (docs/ML_PIPELINE_SPEC.md; Appendix B). Loaded by common/config.py: load_ml_config, which
# refuses unknown keys. Every value a package needs lives here, never in code (spec §20). Parameters change only
# through a reviewed PR (ML-19).
version: 1
label: g12                          # y_g12 / status_g12 / split_g12 (ML-1); must be a label in configs/labels.yaml
allow_unverified: true              # false once the data spec's §11 gate exists (ML-9)

features:
  # Taken out of the registry's model list (§1.4). Regime flags until training covers both values (ML-21).
  # O9: W1 decides whether d12_turnover_total (empty for all of 2022) joins this list for Phase 1.
  exclude: [era, penalty_regime_2025_10]
  # Checked by prepare's regime-coverage flags (§1.4); the quality family's qm_def_post_* flags join when they land.
  regime_sensitive: [staffing_rating, qm_rating, staffing_rating_fn, qm_rating_fn]

windows:
  train_months: 11                  # non-empty months, eval and refit (ML-25)
  min_train_months: 6               # fewer in either window: prepare exits 2
  eval_gap: production_lag          # production_lag (H + B) | purge (gold's purge; reproduction only) (§3.2)

folds: {k: 5}                       # stable hash of ccn (ML-26, §3.4)

members:                            # PR #49's values (§4.2); W1 owns them
  lgbm: {learning_rate: 0.01024, num_leaves: 34, max_depth: 3, min_child_samples: 870, subsample: 0.634,
         subsample_freq: 1, colsample_bytree: 0.335, reg_alpha: 0.0068, reg_lambda: 9.48, min_split_gain: 0.435,
         cat_smooth: 2.71, n_estimators: 1265, seed: 42, deterministic: true, force_col_wise: true, num_threads: 4}
  lr: {C: 0.3, max_iter: 2000, onehot_min_frequency: 50}

ensemble: {weights: {lgbm: 0.5, lr: 0.5}}     # mean of log-odds (ML-16)
selection: {candidates: [ensemble, lgbm, lr], tie_margin: 0.002}
calibration: {method: platt, fit_recent_months: 3}   # ML-24

checks:
  min_score_facilities: 10000       # score rows at t = V; the universe is ~14.7-15.3k (§1.5)
  leakage_flag: {pr_auc_max: 0.6, base_rate_multiple: 3}   # flag above min(pr_auc_max, multiple x base rate)
  leakage_cleared: []               # [{feature: ..., reason: ...}]: lifts a flag's hold at G2

evaluation:
  precision_at: [0.01, 0.02, 0.05, 0.10, 0.20]
  ece_bins: 10
  bootstrap: {replicates: 1000, seed: 0}
  shuffled_label: {n_estimators: 300, roc_range: [0.48, 0.52]}
  development_months: ["2025-02"]   # chosen on by PR #49: reported, never used for decisions (§3.2)

gates:
  first_run: challenger             # challenger (real) | promote (toy smoke run only)
  calibration: {ece_max: 0.05, slope_range: [0.7, 1.3]}
  vs_champion: {pr_auc_worse_max: 0.01, brier_worse_max: 0.005}
  refit: {oof_lift_ratio_min: 0.85, mean_p_band: 0.05, spearman_min: 0.9}

bias:
  slices_config: configs/bias_slices.yaml
  gate_slices: [state, ownership_group, bed_band, chain_status, in_hospital]
  gate_min_facilities: 200
  gate_min_positives: 50
  oe_worse_max: 0.03
  pr_auc_worse_max: 0.05
  oe_abs_max: 0.05                  # non-geographic gated slices
  fdr_alpha: 0.05
  mitigation: none                  # none | reweight

explain: {top_raise: 5, top_lower: 3, labels: configs/reason_labels.yaml, key_features: 15}
monitor: {psi_bins: 10, feature_psi_max: 0.25, score_psi_max: 0.1, mean_shift_max: 0.03, lift_drop_max: 0.15,
          champion_lag_months_max: 3}
tuning: {n_trials: 30, folds: 3, timeout_minutes: 60, early_stopping_rounds: 100, seed: 42}
registry: {model_name: precursor_y_g12, experiment: precursor_y_g12, champion_alias: champion,
           challenger_alias: challenger}

# Keys are relative to the object store root (PI_BUCKET_URI). root_prefix "" when that root holds gold/ (the VM, or a
# laptop stack whose PI_BUCKET_URI already ends in ml-dev); "ml-dev/" for a store rooted at the bucket (§16.4).
outputs: {root_prefix: "", run_prefix: ml/runs, scores_prefix: scores, status_key: status/latest.json}
