# Plain-language reasons for each model feature (docs/ML_PIPELINE_SPEC.md §8.1, ML-34). Scoring shows a facility's
# top risk-raising and risk-lowering features with these labels, so an insurer reads "3 harm-level citations in
# the last 24 months", not "n_cit_GI_24m". One entry per registry feature with model_use: model, in registry order
# (tests/training checks the keys and that every entry is written).
#
# Per feature:
#   label        a noun phrase that reads after "raises risk:" / "lowers risk:", with its window and unit.
#   value_format a Python format string for the feature value ("{:.0f}", "{:.1f}", "{:.0%}", "{}" for text), or
#                the word yes_no for a flag. A value the format can't take is shown as text.
#   null_text    what a missing value means for this feature (default "not reported"); a null can carry a
#                contribution too, e.g. "no standard survey on record".
# A feature missing here falls back to its name (serving/explain.py).
_meta:
  version: 1
labels:
