# Standard-library logging config (logging.config.dictConfig).
# setup_logging() fills in the file handler's filename and may switch the console formatter to json.
version: 1
disable_existing_loggers: false

filters:
  context:
    (): precursorintelligence.common.obs.logging.ContextFilter
  redact:
    (): precursorintelligence.common.obs.logging.RedactFilter

formatters:
  text:
    format: "%(asctime)s %(levelname)-7s %(name)s [%(task)s %(zip_name)s] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  json:
    (): precursorintelligence.common.obs.logging.JsonFormatter

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: text
    filters: [context, redact]
    stream: ext://sys.stderr
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: json
    filters: [context, redact]
    filename: PLACEHOLDER
    maxBytes: 52428800
    backupCount: 5
    encoding: utf-8

loggers:
  precursorintelligence:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  urllib3:
    level: WARNING

root:
  level: WARNING
  handlers: [console]
