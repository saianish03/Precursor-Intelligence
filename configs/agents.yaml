# The agents' settings (docs/AGENTS_PLAN.md). Loaded by common/config.py: load_agents_config, which refuses unknown
# keys. The runtime settings (A1: model ids, max_tokens, timeouts, the daily cap, the cache) join this file later.
version: 1

# build-evidence (E2): what one month's evidence holds and where it goes (layout: evidence/contract.py).
evidence:
  # At the bucket root, never under the ML outputs' root_prefix: sa-api reads only agents/ (L1). A month built from
  # ml-dev/ scores lands here too, with source "ml-dev/" in its manifest.
  prefix: agents/evidence/
  # Citations and penalties dated in (cutoff - months, cutoff]: the cutoff is the first day of the score month, as
  # for the features (point-in-time), and the window matches the 36-month citation features.
  citation_months: 36
  penalty_months: 36
