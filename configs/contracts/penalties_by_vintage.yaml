# Baseline schema for silver/penalties_by_vintage (precursor-pipeline validate).
# Inferred by `validate --write-schema`; tighten by hand (unique, allowed, min, max, str_length, pattern, nullable).
table: penalties_by_vintage
layer: silver
inferred_from: {first: 2021-01, last: 2026-08, months: 61}
# Hand-tightened (marked `# hand`): the key, CCN and month patterns, severity A-L, allowed values from the silver
# configs, domain bounds instead of the largest value seen.
unique: [penalty_event_key]  # hand: the key in configs/keep_columns.yaml
columns:
  ccn: {dtype: String, nullable: false, pattern: '^[0-9A-Z]{6}$'}  # hand: CCN is 6-character text (harmonize/normalize.py CCN_PATTERN)
  penalty_date: {dtype: Date, nullable: false}
  penalty_type: {dtype: String, nullable: false, allowed: [Fine, Payment Denial]}
  fine_amount: {dtype: Float64, nullable: true, min: 0.0}  # hand: no upper bound
  payment_denial_start_date: {dtype: Date, nullable: true}
  payment_denial_length_days: {dtype: Float64, nullable: true}  # hand: CMS data has negative lengths; no range
  fine_id: {dtype: String, nullable: true}
  dup_seq: {dtype: Int64, nullable: false, min: 1}  # hand: no upper bound
  penalty_event_key: {dtype: String, nullable: false}
  vintage_month: {dtype: String, nullable: false, pattern: '^\d{4}-(0[1-9]|1[0-2])$'}  # hand: YYYY-MM
  cutoff_date: {dtype: Date, nullable: false}
